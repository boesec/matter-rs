[package]
name = "matter-rs-config-fuzz"
description = "Fuzz targets of the matter-rs configuration parser, run with cargo-fuzz."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
matter-rs-config = { path = "..", features = ["role-bridge", "adapter-mqtt"] }

# A workspace of its own: the fuzz crate needs a nightly toolchain and libFuzzer, so it stays
# out of the main workspace (which also lists it under `exclude`).
[workspace]
members = ["."]

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false
