[workspace]
resolver = "3"
members = ["crates/*"]
# The fuzz crate of the config parser is built by `cargo fuzz` on its own (nightly, Linux) and is
# not part of the normal build.
exclude = ["crates/config/fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
authors = ["matter-rs authors"]

[workspace.dependencies]
# Workspace crates, layered from the engine facade up to the binary. Which crate may depend on
# which is written down in ARCHITECTURE.md and enforced by the tests of the `matter-rs` package.
matter-rs-engine = { path = "crates/engine", default-features = false }
matter-rs-engine-rsmatter = { path = "crates/engine-rsmatter" }
matter-rs-bridge = { path = "crates/bridge", default-features = false }
matter-rs-adapter-api = { path = "crates/adapter-api", default-features = false }
matter-rs-adapter-mqtt = { path = "crates/adapter-mqtt" }
matter-rs-config = { path = "crates/config" }

# External crates. `thiserror` is used without default features so that the `no_std` crates can
# derive their error types too; crates on the std tier enable its `std` feature themselves.
thiserror = { version = "2.0", default-features = false }
toml = "1.1"
# Configuration model and command line.
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
schemars = { version = "1.2", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Property-based tests of the engine facade (dev-dependency only).
proptest = "1.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# A small, named selection of pedantic lints. Each one guards a class of bug or makes
# public APIs easier to read; the rest of `pedantic` stays off to avoid noise.
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
doc_markdown = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnecessary_wraps = "warn"
