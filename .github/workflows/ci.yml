# Quality gate. Runs the same commands as scripts/check.sh and scripts/check.ps1.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned toolchain with rustfmt.
      - name: Install toolchain
        run: rustup toolchain install
      - name: cargo fmt
        run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install
      - name: cargo test
        run: cargo test --workspace --all-features

  no-std:
    name: no_std tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml lists the bare-metal target, so rustup installs it with the toolchain.
      - name: Install toolchain
        run: rustup toolchain install
      - name: cargo check (no_std crates on thumbv7em-none-eabihf)
        run: cargo check -p matter-rs-engine -p matter-rs-adapter-api -p matter-rs-bridge --no-default-features --target thumbv7em-none-eabihf

  features:
    name: binary feature sets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install
      - name: cargo check (bridge role only)
        run: cargo check -p matter-rs --no-default-features --features role-bridge
      - name: cargo check (default features)
        run: cargo check -p matter-rs

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: cargo deny
        run: cargo deny check
