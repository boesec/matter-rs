# Footprint: builds the build profiles of footprint.toml with the Cargo profile `release-small`,
# measures the stripped binary sizes (on x86_64 and, cross-built with cargo-zigbuild, on two musl
# targets for small boards), the idle memory of the service and the memory and heap peak of the
# engine example with 20 bridged devices, and compares them with the budgets. A measurement above
# its budget turns the job red. The table goes into the step summary, the report is an artefact.
name: Footprint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Pinned tools of the cross builds. Raising one also changes the cache keys below.
  ZIGLANG_VERSION: 0.15.2
  CARGO_ZIGBUILD_VERSION: 0.23.4

jobs:
  footprint:
    name: footprint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml and installs the pinned toolchain with the musl
      # targets of the cross builds.
      - name: Install toolchain
        run: rustup toolchain install

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: footprint-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: footprint-${{ runner.os }}-

      # zig is the linker of the cross builds; the ziglang package ships it, and cargo-zigbuild
      # finds it through `python -m ziglang`.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install zig
        run: |
          python -m pip install "ziglang==${ZIGLANG_VERSION}"
          python -m ziglang version

      - name: Restore cargo-zigbuild
        id: cargo-zigbuild-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_ZIGBUILD_VERSION }}

      - name: Install cargo-zigbuild
        if: steps.cargo-zigbuild-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION"

      - name: Save cargo-zigbuild
        if: steps.cargo-zigbuild-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: ${{ steps.cargo-zigbuild-cache.outputs.cache-primary-key }}

      - name: Measure and compare with the budgets
        run: cargo xtask footprint --cross --markdown footprint-report.md --json footprint-report.json

      - name: Write the step summary
        if: always()
        run: |
          if [ -f footprint-report.md ]; then
            cat footprint-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No footprint report: the measurement did not complete." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: footprint-report
          path: |
            footprint-report.md
            footprint-report.json
          if-no-files-found: ignore
